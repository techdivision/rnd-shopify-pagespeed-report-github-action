name: Performance tests (GCP)

on:
  schedule:
    - cron: '0 4 * * *' # run daily at 4 a.m. UTC
  workflow_dispatch:

jobs:
  pagespeed:
    name: PageSpeed Google Cloud Function
    runs-on: ubuntu-latest
    # Required for Workload Identity Federation. A composite action cannot grant
    # this to itself, so it has to be here.
    # Never add id-token: write to a pull_request workflow.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run PageSpeed report
        uses: techdivision/rnd-shopify-pagespeed-report-github-action@main
        with:
          commit_hash: ${{ github.sha }}
          branch: ${{ github.ref_name }}
          project: ${{ secrets.JIRA_PROJECT }}
          store: ${{ secrets.SHOP_STORE_OS2 }}
          access_token: ${{ secrets.SHOP_ACCESS_TOKEN }}
