name: 'PageSpeed Report for Shopify'
description: 'Run PageSpeed Insights on a Shopify store and send the report to a Google Cloud Function.'
inputs:
  project:
    description: 'The JIRA project ID.'
    required: true
    default: 'CHANGEME'
  store:
    description: 'The Shopify store domain. A bare shop handle gets .myshopify.com appended.'
    required: true
    default: 'changeme.myshopify.com'
  access_token:
    description: 'The Shopify access token. Without it only the home page is measured.'
    required: false
    default: ''
  # commit hash to identify the change responsible for this test
  commit_hash:
    description: 'The git commit hash.'
    required: true
  # branch to group the results
  branch:
    description: 'The git branch.'
    required: true
  runs:
    description: 'How many times to repeat each PageSpeed test (min 1, max 5).'
    required: false
    default: '3'
runs:
  using: 'composite'
  steps:
    # Workload Identity Federation instead of a service account key.
    # GitHub's OIDC token is exchanged for a short-lived identity token; no
    # long-lived credential is stored anywhere.
    #
    # The OIDC token identifies the CALLING repository, not this action, so
    # every shop repo must be on the WIF allowlist and must grant
    # 'id-token: write' on job level. This action repo needs neither.
    - id: auth
      name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        project_id: td-pagespeed-metrics
        workload_identity_provider: projects/724978094750/locations/global/workloadIdentityPools/github-pool/providers/github-oidc
        service_account: sa-github-invoker@td-pagespeed-metrics.iam.gserviceaccount.com
        token_format: id_token
        id_token_audience: https://europe-west3-td-pagespeed-metrics.cloudfunctions.net/td-gcf-pagespeed-metrics-collector
        id_token_include_email: true

    - name: Run PageSpeed script
      shell: bash
      run: ${{ github.action_path }}/run.sh
      env:
        # GitHub Actions Run ID for traceability in downstream systems
        GITHUB_RUN_ID: ${{ github.run_id }}
        INPUT_BRANCH: ${{ inputs.branch }}
        INPUT_COMMIT_HASH: ${{ inputs.commit_hash }}
        INPUT_PROJECT: ${{ inputs.project }}
        INPUT_STORE: ${{ inputs.store }}
        INPUT_ACCESS_TOKEN: ${{ inputs.access_token }}
        INPUT_RUNS: ${{ inputs.runs }}
        # Passed via env, never interpolated into the script text
        ID_TOKEN: ${{ steps.auth.outputs.id_token }}
